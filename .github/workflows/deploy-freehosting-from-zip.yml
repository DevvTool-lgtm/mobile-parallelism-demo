name: Deploy (from dist.zip) to Freehosting

on:
  workflow_dispatch:

jobs:
  deploy-from-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure unzip is available
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Unzip assets/dist.zip into dist/
        run: mkdir -p dist && unzip -o assets/dist.zip -d dist

      - name: Add .htaccess SPA fallback
        run: cp .htaccess dist/.htaccess

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          server-dir: ${{ secrets.FTP_DIR }}
          local-dir: dist
          dangerous-clean-slate: true