name: Deploy to Freehosting

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build (export web)
        run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          BRAND_NAME: ${{ secrets.BRAND_NAME }}
          BRAND_PRIMARY: ${{ secrets.BRAND_PRIMARY }}
          BRAND_ACCENT: ${{ secrets.BRAND_ACCENT }}
          BRAND_LOGO_URL: ${{ secrets.BRAND_LOGO_URL }}

      - name: Add .htaccess SPA fallback
        run: cp .htaccess dist/.htaccess

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          server-dir: ${{ secrets.FTP_DIR }}
          local-dir: dist
          dangerous-clean-slate: true